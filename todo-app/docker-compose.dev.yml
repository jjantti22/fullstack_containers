services:
  app:
    image: todo-front-dev
    volumes:
    - ./todo-frontend:/usr/src/app
  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro,z
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app # wait for the frontend container to be started